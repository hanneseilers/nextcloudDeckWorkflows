# Copy to settings.yaml and adjust if needed. settings.yaml is gitignored.
workflows_dir: workflows
state_db_path: automation/var/state.sqlite3
log_level: INFO
# One run of `python -m automation.main` keeps re-polling and re-running
# workflows for as long as the previous pass triggered at least one of them
# (so a workflow's own actions - e.g. moving a card - can trigger another
# workflow), up to this many seconds. Keep comfortably below your cron
# interval so runs don't overlap.
max_run_seconds: 240
# Optional: email `to` once a workflow has failed `threshold` times in a
# row (and again each time it recovers and then fails that many times
# again) - uses config/smtp.yaml, so that must be set up too. Omit this
# whole section to disable it entirely (the default).
# error_notifications:
#   enabled: true
#   threshold: 3
#   to: "admin@example.com"
# Optional: let Nextcloud (via its own Flow/Webhooks admin settings - a
# server-admin task, not something this project configures) ping
# website/webhook.php when a board changes, instead of relying purely on
# polling. See automation/README.md's "Webhooks" section before enabling
# this - polling never goes away entirely, it becomes the fallback.
# webhooks:
#   enabled: true
#   secret: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
#   fallback_poll_minutes: 15
# Optional: where the website is reachable from outside (no trailing slash
# needed). Needed by the "Einmal-Link erstellen" action (create_action_link),
# which builds its links as <public_url>/link.php?h=<token>.
# public_url: "https://example.com/deck-workflows/website"
