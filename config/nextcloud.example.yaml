# Copy to nextcloud.yaml and fill in your values. nextcloud.yaml is gitignored.
instances:
  - name: prod
    url: "https://cloud.example.com"
    username: "workflow-bot"
    app_password: "CHANGE_ME" # generate under Nextcloud Settings > Security > App passwords
    # Optional hardening for shared hosting: instead of app_password above,
    # use encrypted_app_password (see automation/config/secrets.py):
    #   python -m automation.config.secrets generate-key
    #   python -m automation.config.secrets encrypt "the real app password"
    # encrypted_app_password: "gAAAAA..."
